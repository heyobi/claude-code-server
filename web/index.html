<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Claude Code Server</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111417">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- Not black-translucent. With it iOS draws the page from the top of the
     display but sizes the window as though it began below the status bar, so
     the window is exactly one inset short of the glass and anything fixed to
     its bottom floats that far above the floor. The strip is not the page's to
     paint either — pushing the composer into it cut the composer in half. With
     "default" the window is placed below the status bar and its bottom edge
     lands on the bottom of the screen, which is the whole point. -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root {
  --bg: #f6f7f8;
  --panel: #ffffff;
  --line: #e3e6e9;
  --ink: #14171a;
  --dim: #6b7480;
  --mine: #d9f2e0;
  --accent: #1f6f4a;
  --warn: #8a5a00;
  --code: #f1f3f5;
  /* Frosted surfaces. Translucent enough that what scrolls under them shows
     through as colour, opaque enough to read against. */
  --glass: rgba(255, 255, 255, .62);
  --glass-edge: rgba(255, 255, 255, .75);
  --glass-shade: rgba(0, 0, 0, .07);
  --key: rgba(255, 255, 255, .74);
  /* The rim. Light catches the top of a curved edge and leaves the bottom
     dark; without both, a translucent box stays a box. */
  --rim-top: rgba(255, 255, 255, .90);
  --rim-bottom: rgba(0, 0, 0, .07);
  --rim-line: rgba(255, 255, 255, .40);
  --sheen: rgba(255, 255, 255, .34);
  --cast-near: rgba(0, 0, 0, .10);
  --cast-far: rgba(0, 0, 0, .10);
  /* For surfaces that float over the page with nothing behind them to frost. */
  --solid: rgba(250, 251, 252, .94);
  --veilglass: rgba(255, 255, 255, .26);
  /* The page colour, thinned. Used to fade the conversation out under the
     bars rather than cutting it off with an edge. */
  /* The page colour at four weights, and thin all the way up: the header is
     meant to be looked through, including where the buttons are. What keeps
     the title readable is the blur underneath it, not the tint. */
  --veil: rgba(246, 247, 248, .52);
  --veil-b: rgba(246, 247, 248, .34);
  --veil-c: rgba(246, 247, 248, .16);
  --veil-d: rgba(246, 247, 248, .05);
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111417;
    --panel: #1b1f23;
    --line: #2b3137;
    --ink: #e7eaed;
    --dim: #949ca5;
    --mine: #1e3d2c;
    --accent: #6ddba0;
    --warn: #e0b25e;
    --code: #12161a;
    --glass: rgba(24, 28, 32, .62);
    --glass-edge: rgba(255, 255, 255, .10);
    --glass-shade: rgba(0, 0, 0, .35);
    --key: rgba(58, 66, 75, .68);
    --rim-top: rgba(255, 255, 255, .22);
    --rim-bottom: rgba(0, 0, 0, .40);
    --rim-line: rgba(255, 255, 255, .10);
    --sheen: rgba(255, 255, 255, .09);
    --cast-near: rgba(0, 0, 0, .45);
    --cast-far: rgba(0, 0, 0, .35);
    --solid: rgba(32, 37, 42, .95);
    --veilglass: rgba(20, 24, 28, .28);
    --veil: rgba(17, 20, 23, .52);
    --veil-b: rgba(17, 20, 23, .34);
    --veil-c: rgba(17, 20, 23, .16);
    --veil-d: rgba(17, 20, 23, .05);
  }
}
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  /* Kills the double-tap-to-zoom gesture, which on a chat screen only ever
     fires by accident. */
  touch-action: manipulation;
}
/* One scroller, and it is not the document. A fixed bar drifts on iOS when
   the page itself can move, which is what made the composer slide while
   reading. */
/* Turning the phone sideways and back left every paragraph a size larger.
   That is WebKit inflating text when the layout width changes — it is meant to
   help pages written for a desktop, and this one is written for the phone, so
   it only ever guesses wrong. Pinning it to 100% keeps the user's own text
   size setting working while stopping the guess. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { height: 100%; overflow: hidden; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  overscroll-behavior-y: none;
}
/* The bars float over the conversation rather than sitting beside it. Without
   something passing underneath, a blur has nothing to blur. */
:root {
  --bar-top: 62px; --bar-bottom: 104px;
  --pad-top: env(safe-area-inset-top);
  --pad-bottom: env(safe-area-inset-bottom);
  /* Three quarters of the home indicator's inset. Flat on the floor was right
     while the window was one status bar short of the screen and everything
     needed dragging down; with the window finally reaching the glass it reads
     as stuck to it. This lands where the apps it is measured against sit. */
  --dock-floor: calc(var(--pad-bottom) * .75);
}
/* The keyboard is covering the home indicator, so nothing needs to be held
   clear of it. Same at the top: the shell has already been moved down. */
html.kb { --pad-top: 0px; --pad-bottom: 0px; }

/* iOS handles the keyboard itself: it scrolls the page so that whatever is
   fixed to the bottom of it lands on top of the keys. Sizing a shell to the
   visual viewport fought that and put the composer back under the keyboard —
   and the scroll reset that came with it was doing the pushing. The bars are
   fixed to the viewport again, and the header going off the top while you
   type is iOS's own behaviour, not something worth breaking typing over. */
#app { display: contents; }

/* ---------------------------------------------------------------- header */
/* Not a bar. Two floating controls and a title, with the conversation running
   underneath and dissolving into the background instead of meeting an edge —
   a line across the top is what made it read as a lid over the page. */
header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 5;
  padding: max(12px, calc(var(--pad-top) + 8px)) 10px 62px;
  display: flex; align-items: center; gap: 10px;
  /* Only the controls take touches; the rest is conversation. */
  pointer-events: none;
}
header > * { pointer-events: auto; }
/* Two layers, in this order: the blur, then the fade over it. The blur is
   masked so it stops where the fade does, and if a browser will not mask it
   the fade alone still carries the text off. */
header::before, header::after {
  content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none;
}
header::before {
  /* Stronger than it was, because the tint above it is much weaker now. A
     blur costs no opacity: you still see what is behind, you just cannot read
     it, which is exactly what a header wants. */
  -webkit-backdrop-filter: blur(22px) saturate(150%);
  backdrop-filter: blur(22px) saturate(150%);
  -webkit-mask-image: linear-gradient(180deg, #000 0%,
                      #000 calc(var(--pad-top) + 46px),
                      rgba(0, 0, 0, .58) calc(var(--pad-top) + 70px),
                      rgba(0, 0, 0, .26) calc(var(--pad-top) + 92px),
                      transparent 100%);
  mask-image: linear-gradient(180deg, #000 0%,
              #000 calc(var(--pad-top) + 46px),
              rgba(0, 0, 0, .58) calc(var(--pad-top) + 70px),
              rgba(0, 0, 0, .26) calc(var(--pad-top) + 92px),
              transparent 100%);
}
header::after {
  /* Solid to the bottom of the title, then a long thin ramp — the shorter the
     ramp, the more it reads as an edge. In pixels, not percentages: the header
     is as tall as the status bar makes it, and a percentage would put the ramp
     across the title on one device and below it on another. */
  /* No flat top: the tint thins the whole way down, buttons included, so the
     conversation shows through the header everywhere rather than starting
     under a lid. */
  background: linear-gradient(180deg, var(--veil) 0%,
              var(--veil-b) calc(var(--pad-top) + 44px),
              var(--veil-c) calc(var(--pad-top) + 72px),
              var(--veil-d) calc(var(--pad-top) + 96px),
              transparent 100%);
}
#who { flex: 1; min-width: 0; text-align: center; }
#name {
  font-weight: 650; font-size: 16px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#sub {
  color: var(--dim); font-size: 12.5px;
  display: flex; gap: 6px; align-items: center; justify-content: center;
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
.dot.busy { background: var(--warn); animation: pulse 1s infinite; }
.dot.off { background: var(--dim); }
@keyframes pulse { 50% { opacity: .3; } }
/* Round, filled, no visible border. A drawn outline is what made these read
   as boxes with an icon in them rather than as buttons. 44px because that is
   the smallest thing a thumb hits reliably. */
button.icon {
  position: relative;
  background: var(--key); border: none; color: var(--ink);
  width: 44px; height: 44px; border-radius: 50%; font-size: 19px; flex: none;
  display: flex; align-items: center; justify-content: center;
  -webkit-backdrop-filter: blur(16px) saturate(170%);
  backdrop-filter: blur(16px) saturate(170%);
  box-shadow:
    inset 0 1px 0 0 var(--rim-top),
    inset 0 -1px 0 0 var(--rim-bottom),
    inset 0 0 0 .5px var(--rim-line),
    0 1px 2px var(--cast-near),
    0 6px 16px -6px var(--cast-far);
  transition: transform .14s ease, filter .14s ease;
  overflow: hidden;
}
button.icon::before {
  content: ''; position: absolute; inset: 0; border-radius: inherit;
  pointer-events: none;
  background: linear-gradient(180deg, var(--sheen), transparent 48%);
}
button.icon:active { transform: scale(.9); filter: brightness(.94); }

/* ---------------------------------------------------------------- stream */
#stream {
  position: fixed; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  /* Narrower gutters: the text was being squeezed into the middle of the
     screen for no reason. */
  padding: calc(var(--pad-top) + var(--bar-top)) 10px
           calc(var(--dock-floor) + var(--bar-bottom));
}
/* What you said is a message and sits in one. What the model says is the page
   itself — an answer arriving in a box reads as finished, and it is being
   written while you watch, with tool calls landing in the middle of it. */
.turn { margin: 0 0 14px; }
.turn.user { max-width: 86%; margin-left: auto; }
.turn.assistant { max-width: 100%; }
.bubble { white-space: pre-wrap; overflow-wrap: anywhere; }
.turn.user .bubble {
  background: var(--mine); border-radius: var(--radius);
  padding: 10px 13px;
  box-shadow: inset 0 1px 0 0 var(--rim-top), inset 0 0 0 .5px var(--rim-line);
}
.turn.assistant .bubble { padding: 0 2px; }
.meta { font-size: 11px; color: var(--dim); margin: 5px 2px 0; }
.turn.user .meta { text-align: right; }
.turn.assistant + .turn.user { margin-top: 20px; }
.bubble code, .bubble pre {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px;
}
.bubble code {
  background: var(--code); border-radius: 5px; padding: 1px 5px;
}
.bubble .code {
  margin: 9px 0; border: 1px solid var(--line); border-radius: 10px;
  overflow: hidden; background: var(--code);
}
/* A strip above the code, not floating over it: on a phone the label and the
   first line of code want the same pixels. */
.bubble .code .lang {
  display: block; padding: 5px 11px;
  border-bottom: 1px solid var(--line);
  font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase;
  color: var(--dim); font-family: inherit;
}
.bubble pre {
  background: none; border: none; border-radius: 0;
  padding: 11px 12px; overflow-x: auto; margin: 0; line-height: 1.45;
}
.bubble > :first-child { margin-top: 0; }
.bubble > :last-child { margin-bottom: 0; }
.bubble p { margin: 0 0 8px; }
.bubble p:last-child { margin-bottom: 0; }
.bubble h3, .bubble h4, .bubble h5, .bubble h6 {
  margin: 12px 0 6px; font-size: 15px; font-weight: 650; line-height: 1.3;
}
.bubble ul, .bubble ol { margin: 6px 0 8px; padding-left: 20px; }
.bubble li { margin: 3px 0; }
.bubble blockquote {
  margin: 8px 0; padding: 2px 0 2px 11px;
  border-left: 3px solid var(--line); color: var(--dim);
}
.bubble hr { border: none; border-top: 1px solid var(--line); margin: 12px 0; }
/* Tables scroll inside their own box; the conversation itself never does. */
.bubble .tablewrap {
  overflow-x: auto; margin: 10px 0; border-radius: 10px;
  border: 1px solid var(--line); -webkit-overflow-scrolling: touch;
}
.bubble table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.bubble th, .bubble td {
  padding: 8px 11px; text-align: left; vertical-align: top;
  border-bottom: 1px solid var(--line); white-space: nowrap;
}
.bubble thead th { background: var(--code); font-weight: 650; }
.bubble tbody tr:last-child td { border-bottom: none; }
.bubble a { color: var(--accent); }

/* The answer arriving. A caret is the cheapest way to say "still going". */
.caret {
  display: inline-block; width: 7px; height: 1em; margin-left: 2px;
  background: var(--accent); vertical-align: -2px; animation: blink 1.1s steps(2) infinite;
}
@keyframes blink { 50% { opacity: 0; } }
.note { text-align: center; color: var(--dim); font-size: 12.5px; margin: 14px 0; }

/* permission card */
.ask {
  border: 1px solid var(--warn); border-radius: var(--radius);
  padding: 11px; margin: 0 0 12px; background: var(--panel);
}
.ask h4 { margin: 0 0 8px; font-size: 13.5px; font-weight: 600; }
.ask button {
  display: block; width: 100%; text-align: left; margin-top: 6px;
  padding: 9px 11px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 14px;
}

/* ---------------------------------------------------------------- glass */
/* One recipe, used everywhere. Four layers, and every one of them is doing
   something a flat translucent panel does not:

     rim-top     light along the upper edge, as if it were curved
     rim-bottom  the underside in its own shadow
     rim-line    a hairline the whole way round, so it has a boundary
     sheen       a specular gradient across the top third

   Refraction would be a fifth, displacing the backdrop through an SVG filter,
   but WebKit does not support url() in backdrop-filter, so on the device this
   is built for it does not exist. */
.glassy {
  position: relative;
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  box-shadow:
    inset 0 1px 0 0 var(--rim-top),
    inset 0 -1px 0 0 var(--rim-bottom),
    inset 0 0 0 .5px var(--rim-line),
    0 1px 2px var(--cast-near),
    0 10px 28px -8px var(--cast-far);
}
.glassy::before {
  content: ''; position: absolute; inset: 0; border-radius: inherit;
  pointer-events: none;
  background: linear-gradient(180deg, var(--sheen), transparent 42%);
}
.glassy > * { position: relative; }

/* ---------------------------------------------------------------- tools */
/* A run of tool calls sits between the messages as one quiet line. It is the
   only thing in the stream that is not something someone said, so it is the
   only thing that does not look like a bubble. */
.toolrun {
  display: flex; align-items: center; gap: 9px; width: 100%;
  margin: 0 0 12px; padding: 10px 13px;
  border: none; border-radius: 13px; background: var(--key);
  color: var(--dim); font: inherit; font-size: 13px; text-align: left;
  transition: transform .12s ease;
}
.toolrun:active { transform: scale(.99); }
.toolrun .tname { color: var(--ink); font-weight: 600; flex: none; }
.toolrun .targ {
  flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
}
.toolrun .tmore { flex: none; color: var(--dim); font-size: 17px; }

.toolcard { padding: 12px 13px; }
.toolcard .thead { font-weight: 650; margin-bottom: 9px; font-size: 15px; }
.toolcard .terr { color: var(--warn); font-weight: 500; font-size: 13px; }
.toolcard .tlabel {
  font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em;
  color: var(--dim); margin: 10px 0 5px;
}
.toolcard .code { margin: 0; }
.toolcard pre { max-height: 320px; font-size: 12px; }

/* ----------------------------------------------------------------- menu */
/* Anchored under the button that opens it, sized to its contents. A sheet
   would be the wrong shape for seven short actions. */
/* Overlays live in the visible area too, so a sheet opened with the keyboard
   up does not run underneath it. */
#popveil { position: fixed; inset: 0; z-index: 20; display: none; }
#popveil.open { display: block; }
#pop {
  position: absolute; right: 10px;
  top: calc(var(--pad-top) + 60px);
  width: min(252px, calc(100vw - 20px));
  /* Opacity only. A transform here makes an ancestor containing block, and a
     backdrop-filter inside one has nothing left to sample — which is exactly
     how this ended up see-through. */
  animation: pop .14s ease-out;
}
@keyframes pop { from { opacity: 0; } }
/* This one floats over the conversation with nothing behind it, so unlike a
   group inside a sheet it has to frost its own backdrop. */
/* Denser than a sheet's rows: this is a short list of actions read at a
   glance, not a list of things to compare. */
#pop .row { min-height: 46px; padding: 10px 14px; font-size: 15px; gap: 10px; }
#pop .row small { font-size: 12px; }
#pop .group {
  margin: 0; background: var(--solid);
  -webkit-backdrop-filter: blur(26px) saturate(180%);
  backdrop-filter: blur(26px) saturate(180%);
  box-shadow:
    inset 0 1px 0 0 var(--rim-top),
    inset 0 0 0 .5px var(--rim-line),
    0 2px 6px var(--cast-near),
    0 18px 44px -12px var(--cast-far);
}
#pop .row { min-height: 48px; padding: 11px 14px; font-size: 15px; }
#popveil { -webkit-backdrop-filter: blur(1px); backdrop-filter: blur(1px); }

/* A conversation being read rather than held: there is nothing to send to. */
body.reading #composer { opacity: .35; pointer-events: none; }
.archived {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin: 0 2px 14px; padding: 10px 14px; border-radius: 14px;
  background: var(--key); color: var(--dim); font-size: 12.5px;
  box-shadow: inset 0 0 0 .5px var(--rim-line);
}
.archived span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.archived button {
  border: none; border-radius: 999px; background: var(--accent); color: var(--bg);
  font: inherit; font-size: 12.5px; padding: 7px 13px; flex: none;
}
.archived button.quiet {
  background: var(--key); color: var(--ink);
  box-shadow: inset 0 0 0 .5px var(--rim-line);
}

/* -------------------------------------------------------------- diagrams */
.bubble .mmd {
  margin: 10px 0; padding: 10px; border-radius: 12px;
  background: var(--code); border: 1px solid var(--line);
  overflow-x: auto; text-align: center;
}
/* Before it is drawn it is source, and source should not be laid out as prose. */
.bubble .mmd.pending {
  white-space: pre; text-align: left; color: var(--dim);
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
}
.bubble .mmd svg { max-width: 100%; height: auto; }
.mmdbig { overflow: auto; max-height: 70vh; text-align: center; }
.mmdbig svg { min-width: 100%; height: auto; }

/* ------------------------------------------------------------ chat list */
/* A session row is a conversation, so it shows what the conversation was
   about, not just what it is called. */
.row.chatrow { align-items: flex-start; padding: 12px 15px; }
.row.chatrow::after { content: none; }
.chatrow .ctop { display: flex; align-items: baseline; gap: 8px; }
.chatrow .cname {
  font-weight: 600; font-size: 15px; flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.chatrow .cwhen { font-size: 12px; color: var(--dim); flex: none; }
.chatrow .cprev {
  display: block; font-size: 13.5px; color: var(--dim); margin-top: 2px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.chatrow .ctag {
  display: block; font-size: 11.5px; color: var(--dim); margin-top: 3px;
  opacity: .8;
}
.chatrow .ctick { color: var(--accent); font-weight: 700; margin-left: 8px; }
.chatrow .cpin {
  margin-left: 8px; font-size: 15px; opacity: .22; align-self: center;
  padding: 6px; border-radius: 50%;
}
.chatrow .cpin.on { opacity: 1; }

/* Which slice of the list you are looking at. */
.chips { display: flex; gap: 8px; padding: 2px 2px 12px; overflow-x: auto; }
.fchip {
  flex: none; border: none; border-radius: 999px; font: inherit; font-size: 13px;
  padding: 8px 14px; background: var(--key); color: var(--ink);
  box-shadow: inset 0 1px 0 0 var(--rim-top), inset 0 0 0 .5px var(--rim-line);
}
.fchip.on { background: var(--accent); color: var(--bg); box-shadow: none; }
.row.on.chatrow .cname { color: var(--accent); }

/* ---------------------------------------------------------------- tasks */
.sublabel {
  font-size: 12.5px; letter-spacing: .03em; text-transform: uppercase;
  color: var(--dim); margin: 4px 4px 8px;
}
.stop {
  margin-left: auto; width: 32px; height: 32px; flex: none;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%; background: var(--line); color: var(--ink);
  font-size: 11px;
}
.row.on .stop { color: var(--ink); }

/* ---------------------------------------------------------------- files */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; }
.chip {
  border: none; background: var(--key); color: var(--ink);
  border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 13px;
  min-height: 36px;
  -webkit-backdrop-filter: blur(12px) saturate(170%);
  backdrop-filter: blur(12px) saturate(170%);
  box-shadow:
    inset 0 1px 0 0 var(--rim-top),
    inset 0 0 0 .5px var(--rim-line),
    0 1px 2px var(--cast-near);
  transition: transform .12s ease;
}
.chip:active { transform: scale(.95); }
/* A file preview is a card again — it is a thing, not prose. */
.turn .bubble.preview {
  background: var(--key); border-radius: var(--radius); padding: 11px 12px;
  box-shadow: inset 0 0 0 .5px var(--rim-line);
}
.bubble.preview .fname {
  font-size: 12.5px; color: var(--dim); margin-bottom: 8px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}
.bubble img, .bubble video {
  max-width: 100%; border-radius: 9px; display: block;
}
.bubble audio { width: 100%; }
.turn.preview-wide { max-width: 100%; }

/* Reading back through a long answer, the way out is one tap: the same round
   control, over the composer, showing up only once you are far enough away
   that scrolling back would be work. */
#jump {
  position: fixed; z-index: 4; left: 50%;
  /* Clear of the composer's fade, or it looks like part of it. */
  bottom: calc(var(--dock-floor) + var(--bar-bottom) + 6px);
  width: 40px; height: 40px; font-size: 18px;
  background: var(--glass);
  opacity: 0; pointer-events: none;
  transform: translateX(-50%) translateY(8px);
  transition: opacity .18s ease, transform .18s ease;
}
#jump.on { opacity: 1; pointer-events: auto; transform: translateX(-50%); }
#jump:active { transform: translateX(-50%) scale(.9); }

/* ---------------------------------------------------------------- composer */
/* Sits on the floor of the visible area — the keyboard's top edge when there
   is one, the home indicator when there is not. The fade under it is the
   header's, upside down; a drawn line there cut the conversation in two. */
#composer {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 5;
  display: block;
  padding: 8px 10px var(--dock-floor);
}
#composer::before, #composer::after {
  content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none;
}
#composer::before {
  -webkit-backdrop-filter: blur(14px) saturate(160%);
  backdrop-filter: blur(14px) saturate(160%);
  -webkit-mask-image: linear-gradient(0deg, #000 0%, #000 58%, transparent 100%);
  mask-image: linear-gradient(0deg, #000 0%, #000 58%, transparent 100%);
}
#composer::after {
  background: linear-gradient(0deg, var(--solid) 0%, var(--solid) 46%,
              var(--veil-b) 76%, transparent 100%);
}
/* One panel: what you are writing on top, what you are writing it with
   underneath. The bar behind it is only a backdrop. */
#dock {
  background: var(--key); border-radius: 24px; padding: 6px 6px 6px;
  -webkit-backdrop-filter: blur(16px) saturate(170%);
  backdrop-filter: blur(16px) saturate(170%);
  box-shadow:
    inset 0 1px 0 0 var(--rim-top),
    inset 0 0 0 .5px var(--rim-line),
    0 2px 10px -4px var(--cast-far);
}
#controls { display: flex; align-items: center; gap: 6px; padding: 2px 2px 0; }
#controls .fill { flex: 1; }
#attach { width: 38px; height: 38px; font-size: 21px; line-height: 1; }
/* Plain text next to a round button reads as a label, not a control. Same
   glass as the rest, in a pill, with the chevron that says it opens. */
#modelchip {
  display: inline-flex; align-items: center; gap: 5px;
  border: none; background: var(--key); color: var(--ink);
  font: inherit; font-size: 13.5px; padding: 0 12px; border-radius: 999px;
  height: 38px; max-width: 46vw;
  -webkit-backdrop-filter: blur(16px) saturate(170%);
  backdrop-filter: blur(16px) saturate(170%);
  box-shadow:
    inset 0 1px 0 0 var(--rim-top),
    inset 0 -1px 0 0 var(--rim-bottom),
    inset 0 0 0 .5px var(--rim-line),
    0 1px 2px var(--cast-near);
  transition: transform .14s ease, filter .14s ease;
}
#modelchip .mname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#modelchip:active { transform: scale(.94); filter: brightness(.94); }

/* Messages typed while it was busy, waiting their turn. */
#queued { display: none; flex-wrap: wrap; gap: 6px; padding: 4px 6px 6px; }
#queued.on { display: flex; }
.qchip {
  display: flex; align-items: center; gap: 7px; max-width: 100%;
  border: none; border-radius: 999px; background: var(--line); color: var(--dim);
  font: inherit; font-size: 12.5px; padding: 6px 11px;
}
.qchip span {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60vw;
}
#send.stop { background: var(--warn); }

/* What is about to be sent, before it is sent. Images as thumbnails, because
   the whole point of attaching one is that you can see which one it is. */
#tray { display: none; gap: 8px; padding: 0 0 9px; overflow-x: auto; }
#tray.on { display: flex; }
.att {
  position: relative; flex: none; border-radius: 12px; overflow: hidden;
  background: var(--key); box-shadow: inset 0 0 0 .5px var(--rim-line);
}
.att img { width: 62px; height: 62px; object-fit: cover; display: block; }
.att .name {
  display: flex; align-items: center; height: 62px; padding: 0 12px;
  font-size: 12.5px; color: var(--ink); max-width: 168px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.att .drop {
  position: absolute; top: 3px; right: 3px; width: 20px; height: 20px;
  border: none; border-radius: 50%; background: rgba(0, 0, 0, .62);
  color: #fff; font-size: 11px; line-height: 1; padding: 0;
}
.att.busy { opacity: .5; }

/* An image someone attached, shown in their own message. */
.turn .shots { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 6px; }
.turn .shots img {
  max-width: 190px; max-height: 190px; border-radius: 11px; display: block;
  background: var(--key); min-width: 60px; min-height: 44px;
}
.mediafail {
  font-size: 12.5px; color: var(--warn); padding: 8px 10px;
  border-radius: 10px; background: var(--key);
}

/* Not a textarea. iOS puts an accessory bar over the keyboard for form
   fields — previous, next, and a tick that does nothing here — and there is no
   way to turn it off. A contenteditable region gets no such bar, so the
   composer sits straight on the keys. */
#text {
  display: block; width: 100%; max-height: 132px; overflow-y: auto;
  padding: 9px 12px 4px; border: none; background: none; color: var(--ink);
  box-shadow: none; font-family: inherit;
  white-space: pre-wrap; overflow-wrap: anywhere;
  -webkit-user-modify: read-write-plaintext-only;
  /* Not 15px: anything under 16 makes iOS zoom the page on focus. */
  font-size: 16px;
  line-height: 1.4; min-height: 26px;
}
#text:focus { outline: none; }
#text:empty::before { content: attr(data-placeholder); color: var(--dim); }
#send {
  position: relative; overflow: hidden;
  width: 44px; height: 44px; border: none; border-radius: 50%;
  background: var(--accent); color: var(--bg); font-size: 19px; flex: none;
  box-shadow:
    inset 0 1px 0 0 rgba(255, 255, 255, .40),
    inset 0 -1px 0 0 rgba(0, 0, 0, .18),
    0 2px 6px var(--cast-near),
    0 8px 20px -8px var(--cast-far);
  transition: transform .12s ease, filter .12s ease;
}
#send::before {
  content: ''; position: absolute; inset: 0; border-radius: inherit;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(255,255,255,.32), transparent 50%);
}
#send:active { transform: scale(.92); filter: brightness(.92); }
#send:disabled { opacity: .35; }
#send:disabled { opacity: .4; }

/* ---------------------------------------------------------------- sheet */
#veil {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.32); z-index: 10;
  display: none;
  -webkit-backdrop-filter: blur(3px);
  backdrop-filter: blur(3px);
}
#veil.open { display: block; }
#sheet {
  position: absolute; left: 0; right: 0; bottom: 0;
  background: var(--glass);
  -webkit-backdrop-filter: saturate(180%) blur(30px);
  backdrop-filter: saturate(180%) blur(30px);
  border-top: 1px solid var(--glass-edge);
  border-radius: 22px 22px 0 0;
  padding: 8px 14px calc(env(safe-area-inset-bottom) + 16px);
  max-height: 84vh; overflow-y: auto;
  animation: rise .16s ease-out;
}
@keyframes rise { from { transform: translateY(14px); opacity: .6; } }
/* The grab bar is not draggable; it is there so the sheet reads as a sheet. */
#sheet::before {
  content: ''; display: block; width: 38px; height: 4px; border-radius: 2px;
  background: var(--line); margin: 4px auto 12px;
}
/* Close on the left, title centred: the shape of a sheet on this platform. */
.shead {
  display: flex; align-items: center; gap: 10px; margin: 0 0 14px;
}
.shead h3 {
  flex: 1; margin: 0; font-size: 17px; font-weight: 650; text-align: center;
}
.shead .icon { width: 36px; height: 36px; font-size: 16px; }
#back { font-size: 26px; line-height: 1; padding-bottom: 3px; }
.shead .spacer { width: 36px; flex: none; }
/* Rows live in one surface with hairlines between them, which is how a list
   on this platform looks. Bordering each row separately turned a menu into a
   stack of unrelated boxes. */
.group {
  position: relative;
  background: var(--key); border-radius: 16px; overflow: hidden;
  margin-bottom: 12px;
  box-shadow:
    inset 0 1px 0 0 var(--rim-top),
    inset 0 -1px 0 0 var(--rim-bottom),
    inset 0 0 0 .5px var(--rim-line),
    0 1px 2px var(--cast-near),
    0 10px 28px -10px var(--cast-far);
}
.group::before {
  content: ''; position: absolute; inset: 0; border-radius: inherit;
  pointer-events: none; z-index: 0;
  background: linear-gradient(180deg, var(--sheen), transparent 90px);
}
.group > .row { position: relative; z-index: 1; }
.row {
  display: flex; align-items: center; gap: 11px; width: 100%;
  min-height: 54px; padding: 13px 16px;
  border: none; border-bottom: 1px solid var(--line);
  background: none; color: var(--ink); font: inherit; font-size: 15.5px;
  text-align: left;
  transition: background .12s ease;
}
.group .row:last-child { border-bottom: none; }
.row:active { background: var(--line); }
/* Standalone rows keep their own surface. */
.row.solo {
  background: var(--key); border-radius: 16px; margin-bottom: 10px;
  border-bottom: none;
  box-shadow:
    inset 0 1px 0 0 var(--rim-top),
    inset 0 -1px 0 0 var(--rim-bottom),
    inset 0 0 0 .5px var(--rim-line),
    0 1px 2px var(--cast-near);
}
.row .grow { flex: 1; min-width: 0; }
.row small { color: var(--dim); display: block; font-size: 12.5px; margin-top: 1px; }
.row.on small { color: var(--accent); opacity: .8; }
/* The chosen row: tinted and coloured, since there is no longer a border to
   change. */
.row.on { color: var(--accent); font-weight: 600; }
.row.on::after { content: '✓'; margin-left: auto; font-weight: 700; }
.row.on > span:last-child { display: none; }
.grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
  background: var(--line); border-radius: 16px; overflow: hidden;
  margin-bottom: 12px;
  box-shadow:
    inset 0 1px 0 0 var(--rim-top),
    inset 0 -1px 0 0 var(--rim-bottom),
    inset 0 0 0 .5px var(--rim-line),
    0 1px 2px var(--cast-near),
    0 10px 28px -10px var(--cast-far);
}
.grid .row {
  margin: 0; border: none; border-radius: 0; background: var(--key);
  box-shadow: none; min-height: 62px;
}

#gate { padding: 24px; max-width: 420px; margin: auto; }
#gate input {
  width: 100%; padding: 12px; border-radius: 12px; margin: 12px 0;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  font-family: inherit; font-size: 16px;
}
#gate button {
  width: 100%; padding: 12px; border-radius: 12px; border: none;
  background: var(--accent); color: var(--bg); font: inherit; font-weight: 600;
}
.hide { display: none !important; }
</style>
</head>
<body>

<div id="gate" class="hide">
  <h2 id="brand">Claude Code Server</h2>
  <p style="color:var(--dim)">Sunucudaki erişim anahtarını gir. Anahtarı almak için sunucuda:
  <code>ccs-api --print-token</code></p>
  <input id="tokenInput" type="password" autocomplete="off" placeholder="anahtar">
  <button id="tokenSave">Bağlan</button>
  <p id="gateErr" style="color:var(--warn)"></p>
</div>

<div id="app" class="hide">
  <header>
    <button class="icon" id="back" title="Oturumlar">‹</button>
    <div id="who">
      <div id="name">—</div>
      <div id="sub"><span class="dot off"></span><span id="statusText">bağlanıyor…</span></div>
    </div>
    <button class="icon" id="btnMenu" title="Menü">⋯</button>
  </header>

  <div id="stream"></div>
  <button class="icon" id="jump" type="button" title="En alta in">↓</button>

  <div id="composer">
    <div id="dock">
      <div id="tray"></div>
      <div id="queued"></div>
      <div id="text" contenteditable="true" role="textbox" enterkeyhint="enter"
           aria-multiline="true" aria-label="Mesaj"
           data-placeholder="Mesaj yaz…"></div>
      <div id="controls">
        <button class="icon" id="attach" type="button" title="Ekle">＋</button>
        <button id="modelchip" type="button" title="Model">…</button>
        <span class="fill"></span>
        <button id="send" type="button" title="Gönder">↑</button>
      </div>
    </div>
    <input id="picker" type="file" multiple hidden>
  </div>
</div>

<div id="veil"><div id="sheet"></div></div>
<div id="popveil"><div id="pop"></div></div>

<script src="app.js?v=46"></script>
</body>
</html>
